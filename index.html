<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avcore Tech | Mobile Game & App Studio</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    
    /* Ana Kart Yapısını İkiye Böldük */
    .card {
        background-color: #1e293b;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        max-width: 850px;
        width: 100%;
        border: 1px solid #334155;
        display: flex; /* Yan yana dizilim için */
        overflow: hidden; /* Köşelerin yuvarlak kalması için */
    }

    /* SOL MENÜ (SIDEBAR) TASARIMI */
    .sidebar {
        background-color: #0f172a; /* Menü kısmını biraz daha koyu yaptık */
        width: 260px;
        padding: 40px 20px;
        border-right: 1px solid #334155;
        display: flex;
        flex-direction: column;
    }
    .sidebar h1 {
        margin: 0 0 30px 0;
        font-size: 1.8rem;
        color: #38bdf8;
        text-align: center;
    }
    .nav-link {
        display: block;
        background-color: transparent;
        color: #94a3b8;
        padding: 14px 16px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        margin-bottom: 10px;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        font-size: 0.95rem;
    }
    .nav-link:hover {
        background-color: #1e293b;
        color: #f8fafc;
        border-color: #334155;
        transform: translateX(4px); /* Üzerine gelince hafif sağa kayma efekti */
    }
    .nav-icon {
        margin-right: 8px;
    }

    /* SAĞ İÇERİK ALANI TASARIMI */
    .content {
        padding: 50px 40px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
    }
    .content p {
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 30px;
        font-size: 1.05rem;
    }
    .badge {
        display: inline-block;
        background-color: #0284c7;
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        margin: 5px;
        transition: background-color 0.2s;
    }
    .badge:hover {
        background-color: #0369a1;
    }
    .footer {
        margin-top: 40px;
        font-size: 0.85rem;
        color: #64748b;
    }

    /* MOBİL GÖRÜNÜM (TELEFONLAR İÇİN) */
    @media (max-width: 700px) {
        .card {
            flex-direction: column; /* Mobilde alt alta diz */
        }
        .sidebar {
            width: auto;
            border-right: none;
            border-bottom: 1px solid #334155;
            padding: 30px 20px 20px 20px;
        }
        .content {
            padding: 30px 20px;
        }
        .nav-link:hover {
            transform: none;
        }
    }
</style>
</head>
<body>

<div class="card">
    
    <!-- SOL MENÜ (SEKMELER) -->
    <div class="sidebar">
        <h1>Avcore Tech</h1>
        
        <!-- Privacy Policy (Dış bağlantı olduğu için yeni sekmede açılır) -->
        <a href="https://sites.google.com/view/legacy-privacy-policy/ana-sayfa" target="_blank" class="nav-link">
            <span class="nav-icon">🛡️</span> Privacy Policy
        </a>
        
        <!-- Hizmet Şartları -->
        <a href="hizmet-sartlari.html" class="nav-link">
            <span class="nav-icon">📄</span> Terms of Service
        </a>
    </div>
    
    <!-- SAĞ İÇERİK ALANI -->
    <div class="content">
        <p>Independent mobile application and game development studio.<br><br> Creators of <strong>LEGACY: Life Simulator</strong>.</p>
        
        <div>
            <a href="https://play.google.com/store/apps/details?id=com.avcoretech.legacy.simulator.v1" target="_blank" class="badge">
                Download on Google Play
            </a>
        </div>
        
        <div class="footer">
            &copy; 2026 Avcore Tech. All rights reserved.
        </div>
    </div>

</div>

</body>
</html>
